<!DOCTYPE html>
<html lang="uz">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Mening kassa jadvalim</title>
	<script src="https://telegram.org/js/telegram-web-app.js"></script>
	<style>
		/* Forced Pure Light Theme with Premium UI/UX Polish */
		:root {
			--tg-bg: #f8fafc;
			--tg-card-bg: #ffffff;
			--tg-text: #0f172a;
			--tg-hint: #64748b;
			--border-color: #e2e8f0;
			
			--pos-color: #16a34a;
			--neg-color: #dc2626;
			--run-color: #2563eb;
			--run-bg: #eff6ff;

			--shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
			--shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
		}

		* {
			box-sizing: border-box;
			-webkit-tap-highlight-color: transparent;
		}

		html, body {
			margin: 0;
			padding: 0;
			background: var(--tg-bg) !important;
			color: var(--tg-text) !important;
			font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			font-size: 14px;
			line-height: 1.4;
		}

		#app {
			max-width: 600px;
			margin: 0 auto;
			padding: 10px 8px 32px;
		}

		/* Sleek Compact Header Bar */
		.header-container {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin: 2px 2px 12px;
		}

		.header-badges {
			display: flex;
			align-items: center;
			gap: 8px;
			width: 100%;
			justify-content: space-between;
		}

		.date-badge {
			font-size: 12.5px;
			font-weight: 700;
			padding: 5px 12px;
			border-radius: 20px;
			background: #ffffff;
			color: #334155;
			border: 1px solid var(--border-color);
			box-shadow: var(--shadow-sm);
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.tx-count-badge {
			font-size: 12px;
			font-weight: 600;
			padding: 5px 12px;
			border-radius: 20px;
			background: #ffffff;
			color: var(--tg-hint);
			border: 1px solid var(--border-color);
			box-shadow: var(--shadow-sm);
		}

		/* Cards Grid */
		.cards {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 6px;
			margin-bottom: 14px;
		}

		.card {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			border-radius: 14px;
			padding: 10px 8px;
			cursor: pointer;
			transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
			border: 1px solid var(--border-color);
			background: var(--tg-card-bg);
			box-shadow: var(--shadow-sm);
		}

		.card:active {
			transform: scale(0.97);
		}

		.card-nakit { background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(37, 99, 235, 0.02)); border-color: rgba(59, 130, 246, 0.2); }
		.card-pk { background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(217, 119, 6, 0.02)); border-color: rgba(245, 158, 11, 0.2); }
		.card-usd { background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(5, 150, 105, 0.02)); border-color: rgba(16, 185, 129, 0.2); }

		.card.selected {
			box-shadow: var(--shadow-md);
			transform: translateY(-1px);
		}

		.card-nakit.selected { border-color: #2563eb; outline: 2px solid #2563eb; outline-offset: -2px; }
		.card-pk.selected { border-color: #d97706; outline: 2px solid #d97706; outline-offset: -2px; }
		.card-usd.selected { border-color: #059669; outline: 2px solid #059669; outline-offset: -2px; }

		.card-label {
			font-size: 11.5px;
			font-weight: 600;
			color: var(--tg-hint);
			display: flex;
			align-items: center;
			gap: 4px;
			white-space: nowrap;
			margin-bottom: 4px;
		}

		.card-balance {
			font-size: 14.5px;
			font-weight: 800;
			font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif !important;
			font-variant-numeric: tabular-nums !important;
			white-space: nowrap;
			letter-spacing: -0.01em;
		}

		.card-nakit .card-balance { color: #2563eb; }
		.card-pk .card-balance { color: #d97706; }
		.card-usd .card-balance { color: #059669; }

		/* Table Container - White Theme & Zebra Striped */
		.table-wrap {
			background: #ffffff !important;
			border: 1px solid var(--border-color);
			border-radius: 16px;
			overflow: hidden;
			box-shadow: var(--shadow-sm);
			transition: border-color 0.25s ease;
		}

		.table-wrap.th-nakit { border-top: 3px solid #2563eb; }
		.table-wrap.th-pk { border-top: 3px solid #d97706; }
		.table-wrap.th-usd { border-top: 3px solid #059669; }

		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 13px;
			table-layout: fixed;
			background: #ffffff !important;
		}

		thead th {
			text-align: right;
			font-weight: 700;
			font-size: 11px;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			padding: 11px 6px;
			border-bottom: 1px solid var(--border-color);
			white-space: nowrap;
			transition: background 0.25s ease, color 0.25s ease;
		}

		/* Interactive Sana Sort Header */
		thead th.col-sana {
			cursor: pointer;
			user-select: none;
			-webkit-user-select: none;
		}

		thead th.col-sana:hover {
			opacity: 0.85;
		}

		.sort-icon {
			display: inline-block;
			margin-left: 2px;
			font-size: 10px;
			vertical-align: middle;
		}

		/* Dynamic Header Themes per Account */
		.th-nakit thead th { background: #eff6ff !important; color: #1e40af; }
		.th-pk thead th { background: #fffbeb !important; color: #92400e; }
		.th-usd thead th { background: #ecfdf5 !important; color: #065f46; }

		thead th.l { text-align: left; }
		thead th.col-sana { width: 54px; }
		thead th.col-izoh { width: auto; }
		thead th.col-miqdor { width: 26%; }
		thead th.col-qoldiq { width: 26%; }

		tbody td {
			padding: 10px 6px;
			border-bottom: 1px solid #f1f5f9;
			vertical-align: middle;
			word-break: normal;
			background: transparent;
			color: #0f172a;
		}

		tbody tr:last-child td {
			border-bottom: none;
		}

		/* Zebra Striping */
		tbody tr:nth-child(even) {
			background: #f8fafc !important;
		}

		tbody tr:nth-child(odd) {
			background: #ffffff !important;
		}

		/* Cell Formatting */
		.col-sana-cell {
			white-space: nowrap;
			vertical-align: top;
			padding-top: 10px;
		}

		.l-date {
			font-size: 12px;
			font-weight: 700;
			color: #0f172a;
			font-variant-numeric: tabular-nums;
			line-height: 1.15;
		}

		.l-time {
			font-size: 10px;
			font-weight: 600;
			color: #64748b;
			margin-top: 2px;
			font-variant-numeric: tabular-nums;
		}

		.op-badge {
			display: inline-block;
			font-size: 12px;
			font-weight: 700;
			color: #0f172a;
			margin-bottom: 1px;
			white-space: nowrap;
		}

		.op-sub {
			font-size: 11px;
			color: #64748b;
			line-height: 1.25;
		}

		.l-raw {
			font-size: 10.5px;
			color: #64748b;
			font-style: italic;
			margin-top: 2px;
			opacity: 0.9;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		/* Proportional Font + Tabular Nums for Ultra-Tight Financial Formatting */
		.amt-cell {
			text-align: right;
			font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif !important;
			font-variant-numeric: tabular-nums !important;
			white-space: nowrap;
			font-size: 13px;
			font-weight: 700;
			letter-spacing: -0.01em;
		}

		.amt-pos {
			color: #16a34a;
		}

		.amt-neg {
			color: #dc2626;
		}

		/* Running Balance Qoldiq Column */
		.run-cell {
			text-align: right;
			font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif !important;
			font-variant-numeric: tabular-nums !important;
			white-space: nowrap;
			font-weight: 700;
			font-size: 13px;
			color: #0f172a;
			letter-spacing: -0.01em;
		}

		.run-badge {
			display: inline-block;
			padding: 2px 5px;
			border-radius: 6px;
			background: #eff6ff;
			color: #2563eb;
			font-weight: 700;
			border: 1px solid rgba(37, 99, 235, 0.15);
			font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif !important;
			font-variant-numeric: tabular-nums !important;
			letter-spacing: -0.01em;
		}

		.th-pk .run-badge { background: #fffbeb; color: #b45309; border-color: rgba(245, 158, 11, 0.2); }
		.th-usd .run-badge { background: #ecfdf5; color: #047857; border-color: rgba(16, 185, 129, 0.2); }

		.l-open td {
			color: #64748b;
			font-style: italic;
			background: #f8fafc !important;
			border-top: 1px dashed var(--border-color);
			font-size: 12px;
		}

		/* Skeleton & Empty States */
		.skeleton-bar {
			height: 12px;
			border-radius: 6px;
			background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 37%, #e2e8f0 63%);
			background-size: 400% 100%;
			animation: skeleton-shine 1.4s ease infinite;
		}

		@keyframes skeleton-shine {
			0% { background-position: 100% 50%; }
			100% { background-position: 0 50%; }
		}

		.empty-state {
			text-align: center;
			color: #64748b;
			padding: 32px 16px;
			font-size: 13.5px;
			background: #ffffff;
		}

		.empty-icon {
			font-size: 32px;
			margin-bottom: 6px;
		}

		.state-banner {
			border-radius: 14px;
			padding: 16px;
			text-align: center;
			font-size: 14px;
			margin-bottom: 16px;
		}

		.state-banner.error {
			background: #fef2f2;
			color: #dc2626;
			border: 1px solid #fecaca;
		}
	</style>
</head>
<body>
	<div id="app">
		<div class="header-container">
			<div class="header-badges">
				<div class="date-badge" id="dateBadge">📅 --.--.----</div>
				<div class="tx-count-badge" id="txCount">0 operatsiya</div>
			</div>
		</div>

		<div id="authError" class="state-banner error" hidden></div>

		<div id="content" hidden>
			<div class="cards" id="cards"></div>
			
			<div class="table-wrap th-nakit" id="tableWrap">
				<div id="rows"></div>
			</div>
		</div>
	</div>

	<script>
		(function () {
			"use strict";

			var ENDPOINT = "/api/method/stabler.integrations.kassa.shadow.shadow_view";

			var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
			if (tg) {
				try {
					tg.ready();
					tg.expand();
					if (tg.setHeaderColor) tg.setHeaderColor("#f8fafc");
					if (tg.setBackgroundColor) tg.setBackgroundColor("#f8fafc");
				} catch (e) {
					/* theme application is cosmetic only */
				}
			}

			function triggerHaptic() {
				if (tg && tg.HapticFeedback) {
					try {
						tg.HapticFeedback.selectionChanged();
					} catch (e) {}
				}
			}

			var dateBadgeEl = document.getElementById("dateBadge");
			var authErrorEl = document.getElementById("authError");
			var contentEl = document.getElementById("content");
			var cardsEl = document.getElementById("cards");
			var rowsEl = document.getElementById("rows");
			var txCountEl = document.getElementById("txCount");
			var tableWrapEl = document.getElementById("tableWrap");
			var LAST = null;
			var SELECTED = "nakit";
			var SORT_DIR = "desc"; /* "desc" = Z-A (Newest first), "asc" = A-Z (Oldest first) */

			function toIso(date) {
				var y = date.getFullYear();
				var m = String(date.getMonth() + 1).padStart(2, "0");
				var d = String(date.getDate()).padStart(2, "0");
				return y + "-" + m + "-" + d;
			}

			function isoToDisplay(iso) {
				if (!iso) return "";
				var parts = String(iso).split("-");
				if (parts.length !== 3) return iso;
				return parts[2] + "." + parts[1] + "." + parts[0];
			}

			var KAS = [
				{ id: "nakit", label: "Naqd", suf: "s", ccy: "UZS", cls: "card-nakit", icon: "🟦" },
				{ id: "pk", label: "Karta", suf: "p", ccy: "UZS", cls: "card-pk", icon: "🟧" },
				{ id: "usd", label: "Dollar", suf: "d", ccy: "USD", cls: "card-usd", icon: "🟩" },
			];
			var OPLABEL = { kirim: "Kirim", chiqim: "Chiqim", konversiya: "Konvertatsiya", kassalararo: "Kassalararo" };

			/* Thin space \u2009 with proportional font creates perfectly tight financial separation */
			function grp(fixed) {
				var parts = fixed.split(".");
				var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "\u2009");
				return parts[1] ? intPart + "." + parts[1] : intPart;
			}

			function smart(value) {
				var abs = Math.abs(Number(value) || 0);
				return grp(Number.isInteger(abs) ? abs.toFixed(0) : abs.toFixed(2));
			}

			function formatKas(value, k) {
				var num = Number(value) || 0;
				return (num < 0 ? "-" : "") + smart(num) + k.suf;
			}

			function renderSkeleton() {
				cardsEl.innerHTML =
					'<div class="card card-nakit"><div class="skeleton-bar" style="width:60%"></div></div>' +
					'<div class="card card-pk"><div class="skeleton-bar" style="width:60%"></div></div>' +
					'<div class="card card-usd"><div class="skeleton-bar" style="width:60%"></div></div>';
				var s = '<div style="padding:12px;background:#ffffff;">';
				for (var i = 0; i < 4; i++) {
					s += '<div class="skeleton-bar" style="width:100%;margin-bottom:10px;height:18px;"></div>';
				}
				s += '</div>';
				rowsEl.innerHTML = s;
			}

			function renderCards(balances) {
				var b = balances || {};
				cardsEl.innerHTML = KAS.map(function (k) {
					return (
						'<div class="card ' + k.cls + (SELECTED === k.id ? " selected" : "") + '" data-kassa="' + k.id + '">' +
						'<div class="card-label">' + k.icon + " " + escapeHtml(k.label) + "</div>" +
						'<div class="card-balance">' + escapeHtml(formatKas(b[k.id], k)) + "</div>" +
						"</div>"
					);
				}).join("");
				Array.prototype.forEach.call(cardsEl.querySelectorAll(".card"), function (el) {
					el.addEventListener("click", function () {
						triggerHaptic();
						SELECTED = el.getAttribute("data-kassa");
						renderCards(LAST ? LAST.balances : {});
						renderLedger();
					});
				});
			}

			function renderLedger() {
				var k = KAS.filter(function (x) { return x.id === SELECTED; })[0] || KAS[0];
				
				tableWrapEl.className = "table-wrap th-" + k.id;
				
				if (!LAST) { rowsEl.innerHTML = ""; return; }
				
				function runTxt(v) { return (Number(v) < 0 ? "−" : "") + smart(v); }
				
				var opening = Number((LAST.opening_balances || {})[k.id]) || 0;
				var affecting = (LAST.entries || []).filter(function (e) {
					return (e.legs || []).some(function (l) { return l.kassa === k.id; });
				});
				
				txCountEl.textContent = affecting.length + " operatsiya";

				affecting.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
				var run = opening;
				var rows = affecting.map(function (e) {
					var leg = (e.legs || []).filter(function (l) { return l.kassa === k.id; })[0];
					var delta = Number(leg.delta) || 0;
					run += delta;
					return { e: e, delta: delta, run: run };
				});

				function two(n) { return String(n).padStart(2, "0"); }
				
				if (rows.length === 0) {
					var emptyRow =
						'<div class="empty-state">' +
						'<div class="empty-icon">📂</div>' +
						'<div>Bugun ushbu kassa bo\'yicha operatsiyalar yo\'q</div>' +
						'</div>' +
						'<table><tbody>' +
						'<tr class="l-open"><td class="col-sana-cell">—</td><td>Ochilish balansi</td>' +
						'<td class="amt-cell"></td>' +
						'<td class="run-cell"><span class="run-badge">' + runTxt(opening) + '</span></td></tr>' +
						'</tbody></table>';
					rowsEl.innerHTML = emptyRow;
					return;
				}

				var displayRows = rows.slice();
				if (SORT_DIR === "desc") {
					displayRows.reverse();
				}

				var sortSymbol = SORT_DIR === "desc" ? " ▾" : " ▴";

				var head =
					'<table><thead><tr>' +
					'<th class="l col-sana" id="btnSortSana" title="Tartiblash (A-Z / Z-A)">Sana<span class="sort-icon">' + sortSymbol + '</span></th>' +
					'<th class="l col-izoh">Izoh</th>' +
					'<th class="col-miqdor">Miqdor</th>' +
					'<th class="col-qoldiq">Qoldiq</th>' +
					"</tr></thead><tbody>";
				
				var body = displayRows
					.map(function (r) {
						var e = r.e;
						var d = new Date(e.ts || 0);
						var hm = e.ts ? two(d.getHours()) + ":" + two(d.getMinutes()) : "";
						var dateShort = e.ts ? two(d.getDate()) + "." + two(d.getMonth() + 1) : "";
						var sub = [];
						if (e.counterparty) sub.push(e.counterparty);
						if (e.purpose) sub.push(e.purpose);
						var opTitle = (OPLABEL[e.op] || e.op || "");
						
						var amtHtml = "";
						if (r.delta > 0) {
							amtHtml = '<span class="amt-pos">+' + smart(r.delta) + '</span>';
						} else if (r.delta < 0) {
							amtHtml = '<span class="amt-neg">−' + smart(Math.abs(r.delta)) + '</span>';
						}
						
						return (
							"<tr>" +
							'<td class="col-sana-cell">' +
							'<div class="l-date">' + escapeHtml(dateShort) + "</div>" +
							'<div class="l-time">' + escapeHtml(hm) + "</div>" +
							"</td>" +
							"<td>" +
							'<div class="op-badge">' + escapeHtml(opTitle) + "</div>" +
							(sub.length ? '<div class="op-sub">' + escapeHtml(sub.join(" · ")) + "</div>" : "") +
							(e.raw_text ? '<div class="l-raw">«' + escapeHtml(e.raw_text) + "»</div>" : "") +
							"</td>" +
							'<td class="amt-cell">' + amtHtml + "</td>" +
							'<td class="run-cell"><span class="run-badge">' + runTxt(r.run) + "</span></td>" +
							"</tr>"
						);
					})
					.join("");

				var openRow =
					'<tr class="l-open"><td class="col-sana-cell">—</td><td>Ochilish balansi</td>' +
					'<td class="amt-cell"></td>' +
					'<td class="run-cell"><span class="run-badge">' + runTxt(opening) + "</span></td></tr>";
				
				rowsEl.innerHTML = head + (SORT_DIR === "desc" ? (body + openRow) : (openRow + body)) + "</tbody></table>";

				var btnSort = document.getElementById("btnSortSana");
				if (btnSort) {
					btnSort.addEventListener("click", function () {
						triggerHaptic();
						SORT_DIR = (SORT_DIR === "desc") ? "asc" : "desc";
						renderLedger();
					});
				}
			}

			function escapeHtml(value) {
				return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
					return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
				});
			}

			function showAuthError(message) {
				contentEl.hidden = true;
				authErrorEl.hidden = false;
				authErrorEl.textContent = message;
			}

			function hideAuthError() {
				authErrorEl.hidden = true;
				contentEl.hidden = false;
			}

			function fetchSummary() {
				var initData = tg && tg.initData ? tg.initData : "";
				if (!initData) {
					showAuthError("Ruxsat yo'q. Iltimos, Telegram orqali oching.");
					return;
				}
				renderSkeleton();
				hideAuthError();

				var body = new URLSearchParams({
					init_data: initData,
					date: toIso(new Date()),
				});

				fetch(ENDPOINT, {
					method: "POST",
					headers: { "Content-Type": "application/x-www-form-urlencoded" },
					body: body.toString(),
				})
					.then(function (resp) {
						return resp
							.json()
							.catch(function () {
								return {};
							})
							.then(function (data) {
								if (!resp.ok) {
									var err = new Error("request failed");
									err.status = resp.status;
									throw err;
								}
								return data;
							});
					})
					.then(function (data) {
						var summary = data && Object.prototype.hasOwnProperty.call(data, "message") ? data.message : data;
						if (!summary) throw new Error("empty response");
						render(summary);
					})
					.catch(function (err) {
						if (err && (err.status === 403 || err.status === 401)) {
							showAuthError("Ruxsat yo'q. Telegram orqali oching.");
						} else {
							showAuthError("Xatolik yuz berdi. Qayta urinib ko'ring.");
						}
					});
			}

			function render(summary) {
				LAST = summary;
				dateBadgeEl.textContent = "📅 " + isoToDisplay(summary.date || "");
				renderCards(summary.balances || {});
				renderLedger();
			}

			fetchSummary();
		})();
	</script>
</body>
</html>
