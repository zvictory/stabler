<!DOCTYPE html>
<html lang="uz">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Mening kassa jadvalim</title>
	<script src="https://telegram.org/js/telegram-web-app.js"></script>
	<style>
		:root {
			--tg-bg: #f4f5f7;
			--tg-text: #14161a;
			--tg-hint: #7c8591;
			--card-purple-bg: #5b53d6;
			--card-purple-text: #ffffff;
			--card-green-bg: #e8f5ee;
			--card-green-text: #12351f;
			--pos-color: #1a8a4c;
			--neg-color: #d1373f;
			--border-color: #e3e5e9;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			background: var(--tg-bg);
			color: var(--tg-text);
			font-family:
				-apple-system,
				BlinkMacSystemFont,
				"Segoe UI",
				Roboto,
				Helvetica,
				Arial,
				sans-serif;
			font-size: 15px;
		}

		#app {
			max-width: 560px;
			margin: 0 auto;
			padding: 12px 12px 32px;
		}

		h1 {
			font-size: 18px;
			font-weight: 600;
			margin: 4px 0 14px;
			line-height: 1.3;
		}

		.cards {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
			margin-bottom: 16px;
		}

		.cards.single {
			grid-template-columns: 1fr;
		}

		.card {
			border-radius: 14px;
			padding: 14px 16px;
			min-height: 74px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 4px;
		}

		.card-uzs {
			background: var(--card-purple-bg);
			color: var(--card-purple-text);
		}

		.card-usd {
			background: var(--card-green-bg);
			color: var(--card-green-text);
		}

		.card-other {
			background: #ffffff;
			color: var(--tg-text);
			border: 1px solid var(--border-color);
		}

		.card-nakit { background: rgba(59, 130, 246, 0.14); color: #2563eb; }
		.card-pk { background: rgba(245, 158, 11, 0.16); color: #b45309; }

		.day-pick { margin-bottom: 14px; }
		.day-pick label { display: block; font-size: 11px; color: var(--tg-hint); margin-bottom: 4px; }
		.day-pick input { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--tg-bg); color: var(--tg-text); }
		.entries-head { font-size: 12px; color: var(--tg-hint); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 2px 8px; font-weight: 600; }
		.entries { display: flex; flex-direction: column; gap: 8px; }
		.entry { border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 12px; }
		.entry .e-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
		.entry .e-op { font-size: 14px; font-weight: 600; }
		.entry .e-time { font-size: 11px; color: var(--tg-hint); }
		.entry .e-raw { font-size: 12px; color: var(--tg-hint); margin-bottom: 6px; word-break: break-word; }
		.entry .e-legs { display: flex; flex-wrap: wrap; gap: 5px; }
		.leg { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
		.leg-nakit { background: rgba(59, 130, 246, 0.16); color: #3b82f6; }
		.leg-pk { background: rgba(245, 158, 11, 0.18); color: #f59e0b; }
		.leg-usd { background: rgba(34, 197, 94, 0.16); color: #22c55e; }
		.entry .e-sub { font-size: 11px; color: var(--tg-hint); margin-top: 5px; }
		.entries-empty { text-align: center; color: var(--tg-hint); font-size: 13px; padding: 18px; }

		.card { cursor: pointer; }
		.card.selected { outline: 2px solid currentColor; outline-offset: -2px; }
		.ledger-head { font-size: 14px; font-weight: 600; margin: 0 2px 10px; }
		.ltable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
		.ltable th { text-align: right; font-weight: 600; color: var(--tg-hint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 6px; border-bottom: 1px solid var(--border-color); }
		.ltable th.l { text-align: left; }
		.ltable td { padding: 8px 6px; border-bottom: 1px solid var(--border-color); vertical-align: top; }
		.ltable td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
		.ltable .deb { color: #22c55e; }
		.ltable .cre { color: #f87171; }
		.ltable .run { font-weight: 700; }
		.ltable .l-raw { color: var(--tg-hint); font-size: 11px; margin-top: 2px; word-break: break-word; }
		.ltable .l-open td { color: var(--tg-hint); font-style: italic; }

		.card-label {
			font-size: 12.5px;
			opacity: 0.85;
			font-weight: 500;
		}

		.card-balance {
			font-size: 19px;
			font-weight: 700;
			font-variant-numeric: tabular-nums;
			word-break: break-word;
		}

		.date-range {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
			margin-bottom: 16px;
		}

		.date-field {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		.date-field label {
			font-size: 12.5px;
			color: var(--tg-hint);
			font-weight: 500;
		}

		.date-field input[type="date"] {
			border: 1px solid var(--border-color);
			border-radius: 10px;
			padding: 8px 10px;
			font-size: 14px;
			background: #ffffff;
			color: var(--tg-text);
			width: 100%;
		}

		.table-wrap {
			background: #ffffff;
			border: 1px solid var(--border-color);
			border-radius: 12px;
			overflow: hidden;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 13.5px;
		}

		thead th {
			text-align: left;
			font-weight: 600;
			font-size: 12px;
			color: var(--tg-hint);
			padding: 10px 8px;
			border-bottom: 1px solid var(--border-color);
			white-space: nowrap;
		}

		tbody td {
			padding: 9px 8px;
			border-bottom: 1px solid var(--border-color);
			vertical-align: top;
		}

		tbody tr:last-child td {
			border-bottom: none;
		}

		tbody tr:nth-child(even) {
			background: #fafafa;
		}

		td.col-date {
			white-space: nowrap;
			color: var(--tg-hint);
		}

		td.col-amount,
		td.col-running {
			text-align: right;
			font-variant-numeric: tabular-nums;
			white-space: nowrap;
		}

		.amt-pos {
			color: var(--pos-color);
			font-weight: 600;
		}

		.amt-neg {
			color: var(--neg-color);
			font-weight: 600;
		}

		.empty-row td {
			text-align: center;
			color: var(--tg-hint);
			padding: 28px 8px;
		}

		.skeleton-row td {
			padding: 10px 8px;
		}

		.skeleton-bar {
			height: 11px;
			border-radius: 6px;
			background: linear-gradient(90deg, #eceef1 25%, #f6f7f8 37%, #eceef1 63%);
			background-size: 400% 100%;
			animation: skeleton-shine 1.4s ease infinite;
		}

		@keyframes skeleton-shine {
			0% {
				background-position: 100% 50%;
			}
			100% {
				background-position: 0 50%;
			}
		}

		.state-banner {
			border-radius: 12px;
			padding: 16px;
			text-align: center;
			font-size: 14px;
			margin-bottom: 16px;
		}

		.state-banner.error {
			background: #fdecea;
			color: #8c1d18;
			border: 1px solid #f3c1bd;
		}
	</style>
</head>
<body>
	<div id="app">
		<h1 id="title">Mening kassa jadvalim</h1>

		<div id="authError" class="state-banner error" hidden></div>

		<div id="content" hidden>
			<div class="cards" id="cards"></div>

			<div class="day-pick">
				<label for="toDate">Kun</label>
				<input type="date" id="toDate" />
			</div>

			<div class="ledger-head" id="ledgerHead">Hisob</div>
			<div class="ledger" id="rows"></div>
		</div>
	</div>

	<script>
		(function () {
			"use strict";

			var ENDPOINT = "/api/method/stabler.integrations.kassa.shadow.shadow_view";

			var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
			if (tg) {
				try {
					tg.ready();
					tg.expand();
					if (tg.themeParams && tg.themeParams.bg_color) {
						document.documentElement.style.setProperty("--tg-bg", "#" + stripHash(tg.themeParams.bg_color));
					}
					if (tg.themeParams && tg.themeParams.text_color) {
						document.documentElement.style.setProperty("--tg-text", "#" + stripHash(tg.themeParams.text_color));
					}
					if (tg.themeParams && tg.themeParams.hint_color) {
						document.documentElement.style.setProperty("--tg-hint", "#" + stripHash(tg.themeParams.hint_color));
					}
				} catch (e) {
					/* theme application is cosmetic only */
				}
			}

			function stripHash(hex) {
				return String(hex || "").replace(/^#/, "");
			}

			var titleEl = document.getElementById("title");
			var authErrorEl = document.getElementById("authError");
			var contentEl = document.getElementById("content");
			var cardsEl = document.getElementById("cards");
			var rowsEl = document.getElementById("rows");
			var LAST = null;
			var SELECTED = "nakit";
			var toInput = document.getElementById("toDate");

			function toIso(date) {
				var y = date.getFullYear();
				var m = String(date.getMonth() + 1).padStart(2, "0");
				var d = String(date.getDate()).padStart(2, "0");
				return y + "-" + m + "-" + d;
			}

			function isoToDisplay(iso) {
				if (!iso) return "";
				var parts = String(iso).split("-");
				if (parts.length !== 3) return iso;
				return parts[2] + "." + parts[1] + "." + parts[0];
			}

			function formatAmount(value, currency) {
				var decimals = currency === "UZS" ? 0 : 2;
				var num = Number(value) || 0;
				var abs = Math.abs(num);
				var fixed = abs.toFixed(decimals);
				var parts = fixed.split(".");
				var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
				var out = parts[1] ? intPart + "." + parts[1] : intPart;
				var sign = num < 0 ? "-" : "";
				var suffix = currency === "UZS" ? " so'm" : currency === "USD" ? " $" : " " + (currency || "");
				return sign + out + suffix;
			}

			function cardClass(currency) {
				if (currency === "UZS") return "card card-uzs";
				if (currency === "USD") return "card card-usd";
				return "card card-other";
			}

			function renderSkeleton() {
				cardsEl.className = "cards";
				cardsEl.innerHTML =
					'<div class="card card-nakit"><div class="skeleton-bar" style="width:60%"></div></div>' +
					'<div class="card card-pk"><div class="skeleton-bar" style="width:60%"></div></div>' +
					'<div class="card card-usd"><div class="skeleton-bar" style="width:60%"></div></div>';
				var s = "";
				for (var i = 0; i < 3; i++) {
					s +=
						'<div class="entry"><div class="skeleton-bar" style="width:' +
						(45 + Math.random() * 30) +
						'%"></div><div class="skeleton-bar" style="width:35%;margin-top:7px"></div></div>';
				}
				rowsEl.innerHTML = s;
			}

			var KAS = [
				{ id: "nakit", label: "Nakit", suf: "s", ccy: "UZS", cls: "card-nakit", icon: "🟦" },
				{ id: "pk", label: "PK", suf: "p", ccy: "UZS", cls: "card-pk", icon: "🟧" },
				{ id: "usd", label: "Dollar", suf: "d", ccy: "USD", cls: "card-usd", icon: "🟩" },
			];
			var OPLABEL = { kirim: "Kirim", chiqim: "Chiqim", konversiya: "Konvertatsiya", kassalararo: "Kassalararo" };
			var KSUF = { nakit: "s", pk: "p", usd: "d" };

			function grp(fixed) {
				var parts = fixed.split(".");
				var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
				return parts[1] ? intPart + "." + parts[1] : intPart;
			}

			function formatKas(value, k) {
				var num = Number(value) || 0;
				var out = grp(Math.abs(num).toFixed(2));
				return (num < 0 ? "-" : "") + out + " " + k.suf;
			}

			function renderCards(balances) {
				var b = balances || {};
				cardsEl.className = "cards";
				cardsEl.innerHTML = KAS.map(function (k) {
					return (
						'<div class="card ' + k.cls + (SELECTED === k.id ? " selected" : "") + '" data-kassa="' + k.id + '">' +
						'<div class="card-label">' + k.icon + " " + escapeHtml(k.label) + "</div>" +
						'<div class="card-balance">' + escapeHtml(formatKas(b[k.id], k)) + "</div>" +
						"</div>"
					);
				}).join("");
				Array.prototype.forEach.call(cardsEl.querySelectorAll(".card"), function (el) {
					el.addEventListener("click", function () {
						SELECTED = el.getAttribute("data-kassa");
						renderCards(LAST ? LAST.balances : {});
						renderLedger();
					});
				});
			}

			// Per-kassa ledger: opening + debit/credit + running balance, like a hisob.
			function renderLedger() {
				var k = KAS.filter(function (x) { return x.id === SELECTED; })[0] || KAS[0];
				document.getElementById("ledgerHead").textContent = k.icon + " " + k.label + " — hisob";
				if (!LAST) { rowsEl.innerHTML = ""; return; }
				var dec = 2;
				function n(v) { return grp(Math.abs(Number(v) || 0).toFixed(dec)); }
				var opening = Number((LAST.openings || {})[k.id]) || 0;
				var affecting = (LAST.entries || []).filter(function (e) {
					return (e.legs || []).some(function (l) { return l.kassa === k.id; });
				});
				affecting.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
				var run = opening;
				var rows = affecting.map(function (e) {
					var leg = (e.legs || []).filter(function (l) { return l.kassa === k.id; })[0];
					var delta = Number(leg.delta) || 0;
					run += delta;
					return { e: e, delta: delta, run: run };
				});
				var head =
					'<table class="ltable"><thead><tr>' +
					'<th class="l">Sana / izoh</th><th>Debet</th><th>Kredit</th><th>Qoldiq</th>' +
					"</tr></thead><tbody>";
				var body = rows
					.slice()
					.reverse()
					.map(function (r) {
						var e = r.e;
						var d = new Date(e.ts || 0);
						var hm = e.ts ? String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") : "";
						var sub = [];
						if (e.counterparty) sub.push(e.counterparty);
						if (e.purpose) sub.push(e.purpose);
						var desc = (OPLABEL[e.op] || e.op || "") + (sub.length ? " · " + sub.join(" · ") : "");
						return (
							"<tr>" +
							"<td>" + escapeHtml(hm) +
							(e.raw_text ? '<div class="l-raw">«' + escapeHtml(e.raw_text) + "»</div>" : "") +
							'<div class="l-raw">' + escapeHtml(desc) + "</div></td>" +
							'<td class="num deb">' + (r.delta > 0 ? "+" + n(r.delta) : "") + "</td>" +
							'<td class="num cre">' + (r.delta < 0 ? "−" + n(r.delta) : "") + "</td>" +
							'<td class="num run">' + n(r.run) + " " + k.suf + "</td>" +
							"</tr>"
						);
					})
					.join("");
				var openRow =
					'<tr class="l-open"><td>Ochilish balansi</td><td class="num"></td><td class="num"></td>' +
					'<td class="num run">' + n(opening) + " " + k.suf + "</td></tr>";
				rowsEl.innerHTML = head + body + openRow + "</tbody></table>";
			}

			function escapeHtml(value) {
				return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
					return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
				});
			}

			function showAuthError(message) {
				contentEl.hidden = true;
				authErrorEl.hidden = false;
				authErrorEl.textContent = message;
			}

			function hideAuthError() {
				authErrorEl.hidden = true;
				contentEl.hidden = false;
			}

			function fetchSummary() {
				var initData = tg && tg.initData ? tg.initData : "";
				if (!initData) {
					showAuthError("Ruxsat yo'q. Iltimos, Telegram orqali oching.");
					return;
				}
				renderSkeleton();
				hideAuthError();

				var body = new URLSearchParams({
					init_data: initData,
					date: toInput.value,
				});

				fetch(ENDPOINT, {
					method: "POST",
					headers: { "Content-Type": "application/x-www-form-urlencoded" },
					body: body.toString(),
				})
					.then(function (resp) {
						return resp
							.json()
							.catch(function () {
								return {};
							})
							.then(function (data) {
								if (!resp.ok) {
									var err = new Error("request failed");
									err.status = resp.status;
									throw err;
								}
								return data;
							});
					})
					.then(function (data) {
						var summary = data && Object.prototype.hasOwnProperty.call(data, "message") ? data.message : data;
						if (!summary) throw new Error("empty response");
						render(summary);
					})
					.catch(function (err) {
						if (err && (err.status === 403 || err.status === 401)) {
							showAuthError("Ruxsat yo'q. Telegram orqali oching.");
						} else {
							showAuthError("Xatolik yuz berdi. Qayta urinib ko'ring.");
						}
					});
			}

			function render(summary) {
				LAST = summary;
				titleEl.textContent = "Mening kassam · " + isoToDisplay(summary.date || "");
				renderCards(summary.balances || {});
				renderLedger();
			}

			function initDates() {
				toInput.value = toIso(new Date());
			}

			toInput.addEventListener("change", fetchSummary);

			initDates();
			fetchSummary();
		})();
	</script>
</body>
</html>
