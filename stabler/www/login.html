<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login — Stabler</title>
	<script>
		// Instant redirect to Stabler SPA modern login page
		var redirect = new URLSearchParams(window.location.search).get("redirect-to");
		var target = "/stabler#/login" + (redirect ? "?redirect-to=" + encodeURIComponent(redirect) : "");
		window.location.replace(target);
	</script>
</head>
<body style="background: #0f172a; color: #fff; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
	<div style="text-align: center;">
		<h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">Stabler</h2>
		<p style="color: #94a3b8; font-size: 14px;">Loading Stabler Login Portal…</p>
	</div>
</body>
</html>
