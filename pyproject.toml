[project]
name = "stabler"
authors = [
    { name = "Stabler", email = "admin@stabler.app" }
]
description = "Financial operations, simplified"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    "python-docx>=1.1",  # tender bid-package docx generation (api/_bid_package.py)
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", "B018", "B023", "B904",
    "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722",
    "W191",
    "UP030", "UP031", "UP032", "UP037", "UP040",
    # Latin-confusable lints (ambiguous unicode in strings / docstrings /
    # comments). Stabler ships five languages (en, ru, uz, uzc, tr) and parses
    # the 1C ClientBank Exchange format, whose field keys are Cyrillic. Cyrillic
    # С next to Latin C is the product, not a typo -- 223 of the tree's 614
    # findings were this, all false positives. These used to be per-file ignores
    # for the bank-statement parser; the exception is codebase-wide in practice,
    # so state it once instead of growing the per-file list forever.
    "RUF001", "RUF002", "RUF003",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
