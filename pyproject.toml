[project]
name = "stabler"
authors = [
    { name = "Stabler", email = "admin@stabler.app" }
]
description = "Financial operations, simplified"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    "python-docx>=1.1",  # tender bid-package docx generation (api/_bid_package.py)
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", "B018", "B023", "B904",
    "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722",
    "W191",
    "UP030", "UP031", "UP032", "UP037", "UP040",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
# The bank-statement parser and its tests must contain Cyrillic field keys to
# parse the 1C ClientBank Exchange (Russian-language) format. Disable the
# Latin-confusable lints there; they are false positives by design.
"stabler/integrations/bank_statement/*" = ["RUF001", "RUF002", "RUF003"]
"stabler/tests/test_bank_statement_parser.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
