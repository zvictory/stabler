name: CI

# Stabler continuous integration.
#
#   job 1 (fast, always)  — lint + the frappe-free unit tests. No DB, seconds.
#   job 2 (integration)   — spin up MariaDB + Redis + a throwaway Frappe site,
#                           install stabler, run the full test suite.
#
# Keep job 1 green as a hard gate on every PR; job 2 is the deeper safety net.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + unit (no DB)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Frappe 16 runtime. pyproject declares >=3.14, but 3.14 is not yet GA
          # on CI runners; 3.12 is Frappe 16's supported interpreter and runs the
          # frappe-free unit tests fine. Bump to 3.14 once runners ship it.
          python-version: "3.12"

      - name: Install ruff
        # PINNED on purpose. Unpinned, a new ruff release adds rules and turns
        # the gate red with zero code changes (0.16.0's RUF059 alone is 98 hits
        # here). Bump this together with RUFF_VERSION in the Makefile.
        run: pip install 'ruff==0.16.0'

      - name: Ruff lint
        run: ruff check stabler

      - name: Ruff format check
        run: ruff format --check stabler

      - name: Byte-compile all Python
        run: python -m compileall -q stabler

      - name: Pure unit tests (frappe-free)
        # The module list lives in .github/frappe-free-tests.txt -- add new
        # bench-free test modules there, not here.
        # -n1 = one module per process, deliberately. Several modules install a
        # fake `frappe` into sys.modules and never restore it, so a single
        # combined run leaks MagicMocks into whichever module imports next
        # (test_stock_recon is the current victim). Process isolation keeps the
        # gate order-independent. xargs still exits non-zero if any module fails.
        #
        # xargs, not $(...) word-splitting: zsh does not split unquoted
        # expansions, so the $(...) form silently breaks when run locally.
        run: |
          echo "frappe-free modules: $(grep -cv -e '^#' -e '^$' .github/frappe-free-tests.txt)"
          grep -v -e '^#' -e '^$' .github/frappe-free-tests.txt \
            | xargs -n1 python -m unittest

      - name: Hard-rule guards (CLAUDE.md)
        # CLAUDE.md states these as "reviewers must reject". Prose does not
        # enforce; this does. All three are at zero violations as of 2026-07-25.
        run: |
          fail=0
          hits=$(grep -rn 'type="date"' stabler/public/js --include='*.vue' \
                   | grep -v 'components/DateInput.vue' || true)
          if [ -n "$hits" ]; then
            echo "::error::bare <input type=\"date\"> is banned -- use DateInput.vue"
            echo "$hits"; fail=1
          fi

          # Quote-prefixed only: a bare /app/ match also hits prose that merely
          # mentions the rule (StockLedgerDetail.vue:6).
          hits=$(grep -rnE '["'"'"'`]/app/' stabler/public/js --include='*.vue' || true)
          if [ -n "$hits" ]; then
            echo "::error::Frappe Desk link (/app/...) is banned -- build the CRUD inside Stabler"
            echo "$hits"; fail=1
          fi

          hits=$(grep -rn 'table-striped' stabler/public/js --include='*.vue' || true)
          if [ -n "$hits" ]; then
            echo "::error::manual table-striped is redundant -- striping is global in stabler.css"
            echo "$hits"; fail=1
          fi

          exit $fail

  bench-tests:
    name: Integration (bench run-tests)
    runs-on: ubuntu-22.04
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: stabler  # checkout the app into a named dir for get-app

      - uses: actions/setup-python@v5
        with:
          # Frappe 16 runtime. pyproject declares >=3.14, but 3.14 is not yet GA
          # on CI runners; 3.12 is Frappe 16's supported interpreter and runs the
          # frappe-free unit tests fine. Bump to 3.14 once runners ship it.
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mariadb-client redis-tools wkhtmltopdf
          npm install -g yarn
          pip install frappe-bench

      - name: Configure MariaDB for Frappe
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Init bench + site + install stabler
        run: |
          cd ~
          bench init --skip-redis-config-generation --frappe-branch version-16 frappe-bench
          cd frappe-bench
          # Point bench at the CI service containers.
          bench set-config -g redis_cache "redis://localhost:6379"
          bench set-config -g redis_queue "redis://localhost:6379"
          bench set-config -g redis_socketio "redis://localhost:6379"
          bench get-app erpnext --branch version-16
          bench get-app stabler "$GITHUB_WORKSPACE/stabler"
          bench new-site test_site \
            --mariadb-root-password root \
            --admin-password admin \
            --db-host 127.0.0.1 --no-mariadb-socket
          bench --site test_site install-app erpnext stabler
          bench --site test_site set-config allow_tests true

      - name: Run stabler tests
        run: |
          cd ~/frappe-bench
          bench --site test_site run-tests --app stabler

      - name: Build frontend
        run: |
          cd ~/frappe-bench
          bench build --app stabler
